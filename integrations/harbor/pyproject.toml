[project]
name = "subconscious-code-harbor"
version = "0.1.0"
description = "Harbor benchmark adapter for the Subconscious Code harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Subconscious Systems" }]
dependencies = ["harbor>=0.13,<0.14"]

[project.urls]
Homepage = "https://github.com/subconscious-systems/subconscious-code"
Repository = "https://github.com/subconscious-systems/subconscious-code"
Issues = "https://github.com/subconscious-systems/subconscious-code/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subconscious_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
