[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# Shared dependency versions. Crates reference these with `<dep>.workspace = true`
# so versions stay in lockstep and the dependency direction in §1 is enforced
# by what each crate is allowed to pull in.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# M0: rt + macros. M1: sync (semaphore). M2: process + io-util + time (Bash).
# Later milestones may add fs/signal.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.1", features = ["fmt", "env-filter"] }
bytes = "1"
# Request-body gzip (opt-in): at our body sizes wire time dominates.
flate2 = "1"
wiremock = "0.6"
insta = "1"

[profile.release]
# Static, self-contained binary; no dynamic loader surprises.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
