[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["integrations/dlr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# Shared dependency versions. Crates reference these with `<dep>.workspace = true`
# so versions stay in lockstep and the dependency direction in §1 is enforced
# by what each crate is allowed to pull in.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# M0: rt + macros. M1: sync (semaphore). M2: process + io-util + time (Bash).
# Later milestones may add fs/signal.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
tokio-stream = "0.1"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.1", features = ["fmt", "env-filter"] }
bytes = "1"
# Request-body gzip (opt-in): the Rust backend benchmarks faster at level 1 on
# our supported ARM target than zlib-ng, while avoiding a C/CMake build step.
flate2 = "1"
memchr = "2"
wiremock = "0.6"
insta = "1"
# SHA-256 provides stable block identities; BLAKE3's SIMD XOF expands each
# identity across the full LtHash accumulator.
sha2 = "0.10"
blake3 = "1"
libc = "0.2"
dlr-sidecar = { path = "integrations/dlr/crates/sidecar" }

[profile.release]
# Static, self-contained binary; no dynamic loader surprises.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
