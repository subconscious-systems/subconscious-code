name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/check-release-version.py --tag "$RELEASE_TAG"
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Check DLR workspace
        run: |
          cargo fmt --manifest-path integrations/dlr/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path integrations/dlr/Cargo.toml \
            --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  release-binaries:
    name: Release binary (${{ matrix.target }})
    needs: release-preflight
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
            file_pattern: "x86-64"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: cross
            file_pattern: "ARM aarch64"
          - target: aarch64-apple-darwin
            runner: macos-15
            builder: cargo
            file_pattern: "arm64"
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: cargo
            file_pattern: "x86_64"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: runner.os == 'Linux'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build sc
        run: ${{ matrix.builder }} build --locked --release --target "${{ matrix.target }}" --bin sc
      - name: Package and validate binary
        env:
          FILE_PATTERN: ${{ matrix.file_pattern }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/sc" dist/package/sc
          tar -C dist/package -czf "dist/sc-$TARGET.tar.gz" sc
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "sc-$TARGET.tar.gz" > "sc-$TARGET.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "sc-$TARGET.tar.gz" > "sc-$TARGET.tar.gz.sha256")
          fi
          cosign sign-blob --yes \
            --bundle "dist/sc-$TARGET.tar.gz.sigstore.json" \
            "dist/sc-$TARGET.tar.gz"
          cosign sign-blob --yes \
            --bundle "dist/sc-$TARGET.tar.gz.sha256.sigstore.json" \
            "dist/sc-$TARGET.tar.gz.sha256"
          file "target/$TARGET/release/sc" | grep -F "$FILE_PATTERN"
          if [[ "$TARGET" != "aarch64-unknown-linux-musl" ]]; then
            "target/$TARGET/release/sc" --version
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: sc-${{ matrix.target }}
          path: |
            dist/sc-${{ matrix.target }}.tar.gz
            dist/sc-${{ matrix.target }}.tar.gz.sha256
            dist/sc-${{ matrix.target }}.tar.gz.sigstore.json
            dist/sc-${{ matrix.target }}.tar.gz.sha256.sigstore.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: release-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
