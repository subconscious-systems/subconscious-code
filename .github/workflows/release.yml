name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-version.py --tag "$RELEASE_TAG"
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Check DLR workspace
        run: |
          cargo fmt --manifest-path integrations/dlr/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path integrations/dlr/Cargo.toml \
            --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  linux-binaries:
    needs: release-preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build sc
        run: cross build --locked --release --target "${{ matrix.target }}" --bin sc
      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/sc" dist/package/sc
          tar -C dist/package -czf "dist/sc-$TARGET.tar.gz" sc
          (cd dist && sha256sum "sc-$TARGET.tar.gz" > "sc-$TARGET.tar.gz.sha256")
          cosign sign-blob --yes \
            --bundle "dist/sc-$TARGET.tar.gz.sigstore.json" \
            "dist/sc-$TARGET.tar.gz"
          cosign sign-blob --yes \
            --bundle "dist/sc-$TARGET.tar.gz.sha256.sigstore.json" \
            "dist/sc-$TARGET.tar.gz.sha256"
          "target/$TARGET/release/sc" --version
      - uses: actions/upload-artifact@v4
        with:
          name: sc-${{ matrix.target }}
          path: |
            dist/sc-${{ matrix.target }}.tar.gz
            dist/sc-${{ matrix.target }}.tar.gz.sha256
            dist/sc-${{ matrix.target }}.tar.gz.sigstore.json
            dist/sc-${{ matrix.target }}.tar.gz.sha256.sigstore.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: linux-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
