name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.89 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            integrations/dlr
      - run: cargo check --locked --workspace
      - run: cargo check --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  dlr:
    name: DLR workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/dlr
      - run: cargo fmt --manifest-path integrations/dlr/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path integrations/dlr/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path integrations/dlr/Cargo.toml --workspace

  harbor:
    name: Harbor adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project integrations/harbor --extra test --locked
      - run: uv run --project integrations/harbor pytest
