[package]
name = "rc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-proto = { path = "../rc-proto" }
rc-tokenize = { path = "../rc-tokenize" }
rc-perm = { path = "../rc-perm" }
rc-algebra = { path = "../rc-algebra" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true }
async-trait = { workspace = true }
tracing.workspace = true
tokio-util = { workspace = true }
tokio-stream.workspace = true
libc.workspace = true
blake3.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes"] }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
